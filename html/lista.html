<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/estilo.css">
    <script type="module" src="../javascript/script.js" defer></script>
    <title>Lista de filmes</title>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h1 style="margin-bottom: 0; border-bottom: none;">Lista de Filmes</h1>
        <button id="btnSair" style="padding: 10px 20px; background: #5a1a1a; color: #ff9999; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; letter-spacing: 1px;">🚪 SAIR</button>
    </div>
    <div>
        <input type="text" id="titulo" placeholder="Título do filme" required>
        <select id="genero">
            <option value="" disabled selected hidden>Selecione o Gênero</option>
            <option value="Ação">🔥 AÇÃO</option>
            <option value="Comédia">😂 COMÉDIA</option>
            <option value="Drama">🎭 DRAMA</option>
            <option value="Terror">👻 TERROR</option>
            <option value="Ficção">🚀 FICÇÃO</option>
            <option value="Romance">💖 ROMANCE</option>
        </select>
        <button id="btnAdicionar">Adicionar</button>
    </div>
    <table>
        <thead>
        <tr>
            <th>Título</th>
            <th>Gênero</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script type="module">
    const token = sessionStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }

    document.getElementById('btnSair').addEventListener('click', () => {
        sessionStorage.removeItem('token');
        window.location.href = 'login.html';
    });
</script>
</body>
</html>
