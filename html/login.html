<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../estilos/authEstilo.css">
</head>
<body>
    <div class="auth-container">
        <h1>🎬 Login</h1>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        <button id="btnLogin">Entrar</button>
        <p>Não tem conta? <a href="cadastro.html">Cadastrar</a></p>
    </div>

    <script type="module">
    const urlBase = 'http://localhost:3000/auth';

    document.getElementById('btnLogin').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;

        try {
            const response = await fetch(urlBase + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const dados = await response.json();

            if (!response.ok) throw new Error(dados.error || 'Erro ao logar');

            // Salva o token no sessionStorage para usar nas próximas requisições
            sessionStorage.setItem('token', dados.token);

            window.location.href = 'lista.html';
        } catch (e) {
            alert('Erro: ' + e.message);
        }
    });
    </script>
</body>
</html>
